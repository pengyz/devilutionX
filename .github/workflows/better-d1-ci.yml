name: Better D1 CI

# Full integration gate for the Better D1 fork:
#  - builds all test targets (benchmark excluded: system libbenchmark LTO mismatch)
#  - runs the complete ctest suite against downloaded spawn.mpq
#  - runs the mechanical drift check (line endings, placeholder tests, registration)
#  - uploads the structured JSON report as an artifact

on:
  push:
    branches:
      - feature/qol-upgrades
      - 'feature/**'
      - 'engine-mod-infra'
    paths-ignore:
      - 'docs/**'
  pull_request:
    types: [ opened, synchronize ]
    paths-ignore:
      - 'docs/**'
  schedule:
    # Nightly regression: run the full eval suite (65 cases) on the default branch.
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      run_eval_smoke:
        description: 'Run the D1-eval smoke gate (fast curated cases)'
        type: boolean
        default: false
      run_eval_nightly:
        description: 'Run the full D1-eval nightly suite (65 cases)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake ninja-build curl g++ git lcov libgtest-dev libgmock-dev libsdl2-dev libsodium-dev libpng-dev libbz2-dev wget

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: build
        key: ${{ github.workflow }}-v4-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v4-

    # We specify `-DDEVILUTIONX_SYSTEM_BENCHMARK=OFF` to work around:
    # lto1: fatal error: bytecode stream in file ‘/usr/lib/x86_64-linux-gnu/libbenchmark_main.a’
    # generated with LTO version 11.2 instead of the expected 13.1
    - name: Build
      run: |
        cmake -S. -Bbuild -G Ninja -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build
        cmake --build build -j $(nproc)

    - name: Run full test suite
      run: cd build && ctest --output-on-failure

    - name: Drift check
      run: |
        # check_drift.py compares against a baseline ref. In CI, origin is this
        # fork whose master may not share history with the feature branch, so
        # fetch the upstream baseline into its own ref and pass it explicitly.
        git fetch --no-tags https://github.com/diasurgical/DevilutionX.git master:refs/remotes/upstream/master || true
        python3 tools/check_drift.py --base refs/remotes/upstream/master

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-report
        path: build/Testing/Temporary/LastTest.log
        if-no-files-found: ignore

  # Optional D1-eval smoke gate: runs the curated fast cases via the eval skill.
  # Triggered manually (workflow_dispatch -> run_eval_smoke). Promote to a
  # required job after it proves stable.
  eval-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval_smoke
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake ninja-build curl g++ git libgtest-dev libgmock-dev libsdl2-dev libsodium-dev libpng-dev libbz2-dev wget

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: build
        key: ${{ github.workflow }}-v4-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v4-

    - name: Build test binaries
      run: |
        cmake -S. -Bbuild -G Ninja -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build
        cmake --build build -j $(nproc)

    - name: Run eval smoke gate
      run: python3 -m tools.eval.backend --smoke --json eval-smoke.json

    - name: Upload eval smoke report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-smoke-report
        path: eval-smoke.json
        if-no-files-found: ignore

  # Nightly D1-eval regression: full 65-case suite.
  # Triggered by schedule (02:00 UTC daily) or manually (run_eval_nightly).
  eval-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_eval_nightly)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake ninja-build curl g++ git libgtest-dev libgmock-dev libsdl2-dev libsodium-dev libpng-dev libbz2-dev wget

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: build
        key: ${{ github.workflow }}-v4-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v4-

    - name: Build test binaries
      run: |
        cmake -S. -Bbuild -G Ninja -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build
        cmake --build build -j $(nproc)

    - name: Run eval nightly suite
      run: python3 -m tools.eval.backend --set nightly --json eval-nightly.json

    - name: Upload eval nightly report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-nightly-report
        path: eval-nightly.json
        if-no-files-found: ignore
