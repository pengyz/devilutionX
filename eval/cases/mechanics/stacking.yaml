id: "mechanics-stacking"
name: "消耗品堆叠：腰带堆叠与容量"
category: "mechanics"
difficulty: "medium"
tags: ["stacking", "belt"]

setup:
  mpq_required: false
  timeout: 60

run:
  backend: "gtest"
  binary: "consumable_stack_test"
  filter: "ConsumableStackTest.*"

expected:
  exit_code: 0
  failed: 0
  passed_min: 15
  skipped_max: 0
  output_contains: ["[  PASSED  ]"]

description: >
  背包堆叠上限（药水5/卷轴3，不因职业而异）+ 腰带 8×1（恢复原版
  红蓝配比，宪章 §6 裁决）。
