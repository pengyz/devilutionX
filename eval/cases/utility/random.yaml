id: "utility-random"
name: "随机数生成"
category: "utility"
difficulty: "basic"
tags: ["rng"]

setup:
  mpq_required: false
  timeout: 60

run:
  backend: "gtest"
  binary: "random_test"
  filter: "RandomTest.*"

expected:
  exit_code: 0
  failed: 0
  passed_min: 1
  skipped_max: 5
  output_contains: ["[  PASSED  ]"]

description: >
  随机数生成。
