# 维护提醒（R35）：本 case 的 `expected.passed_min` 与 `output_contains` 里的
# "[  PASSED  ] N tests." 是**硬编码的用例计数**。往 SamplingBaselineTest 里新增或删除用例后
# 必须同步这两处数字，否则门禁会静默失效（N 偏小 → 少跑也算过）或误红
# （N 偏大 → 全绿也判失败）。当前值对应 30 个用例（2026-09-16 核对；R38 两个结构守卫 RosterPerSeedVariety /
# HellUniqueBasesRemainReachable 后 24 -> 26；阶段 B Task 1 的两个 G1 用例
# LeaderDeathReleasesMinions / UniqueLeaderDeathBehaviourUnchanged 后 26 -> 28；阶段 B Task 2 的
# 两个 G2 用例 SquadMinionsUnbuffed / UniqueMinionsBehaviourUnchanged 后 28 -> 30；
# 阶段 B 最终修复轮 RB26/RB27 的三个用例 LeaderDeathReleasesSeparatedMinions /
# UniqueLeaderDeathKeepsSeparatedMinionIndex / BuffedMinionPredicateTracksToughening 后 30 -> 33）。
#
# 口径说明（2026-09-17，含 U1 修复）：33 是**有素材环境**（DIABDAT.MPQ 或 Hellfire 在位）的计数。
# UniqueMinionsBehaviourUnchanged 会探测所选 Leashed unique 的 `monsters\monsters\<mTrnName>.trn`，
# 该素材只随零售/HF 数据发布，**不随 spawn.mpq**。因此本 case 显式声明真实数据依赖
# `setup.retail_or_hf_required: true`：在只有 spawn.mpq 的环境（如 nightly CI）下**整案跳过**，
# 而不是跑到一半判失败。**不要为迁就 spawn-only 下调 passed_min 或放宽断言**——
# 依赖由门控表达，断言强度保持不变。
id: "sampling-anti-monopoly-cap"
name: "采样反垄断：B1 cap 后契约（真实引擎 GetLevelMTypes）"
category: "rng"
difficulty: "medium"
tags: ["sampling", "monster-generation", "baseline"]

setup:
  mpq_required: true
  # U1：本 case 的用例需要 unique 怪染色 TRN（零售或 HF 提供），spawn.mpq 不够。
  retail_or_hf_required: true
  timeout: 120

run:
  backend: "gtest"
  binary: "sampling_behavior_test"
  filter: "SamplingBaselineTest.*"

expected:
  exit_code: 0
  failed: 0
  passed_min: 36
  skipped_max: 1
  output_contains: ["[  PASSED  ] 36 tests."]

description: >
  B1 采样反垄断 harness（纯测试）：直接驱动真实 GetLevelMTypes 采样循环。
  2026-09-18 内容密度契约后的口径：地狱 L13-15 的**远程类**尾受 cap=1 约束（实测 0）；
  洞穴风筝**类型**尾不再受 cap 约束——caves kite cap 已按合同 R4 反转退役（它使 5-6 个
  kite 类型永不可抽，L10 并集 12 < vanilla 17），其**放置**垄断症状由
  PlacedClassMixWithinBaseline 守卫（ranged share 不高于 vanilla；L9-12 实测
  0.462348/0.442413/0.436842/0.40646，均低于 vanilla）。洞穴任意类尾重钉为
  L9 77.20% / L10-L12 100%（kite cap 退役后 L9 由 59.93% 升至 77.20%）。
  内容密度地板由 ContentDensityWithinVanillaFloor 断言：L1-15 的单局种类、distinct AI
  与跨局并集不得低于 vanilla（地板经“超范围单行”夹具实测导出）。
  # 2026-09-18（密度收顶契约）：新增 3 条判据 —— RosterCoreSizeWithinIdentityBound（core ≤5）、
  # PerRunTypesWithinBandCeiling（逐带单局种类上限）、AdjacentLevelCoresRemainDistinct（相邻层 core Jaccard ≤0.4）
  # ⇒ 本 case 的用例数 33 → 36。
