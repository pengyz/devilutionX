# 维护提醒（R35）：本 case 的 `expected.passed_min` 与 `output_contains` 里的
# "[  PASSED  ] N tests." 是**硬编码的用例计数**。往 LevelRosterBaselineTest 或 SquadPlacementTest 里新增或删除用例后
# 必须同步这两处数字，否则门禁会静默失效（N 偏小 → 少跑也算过）或误红
# （N 偏大 → 全绿也判失败）。当前值对应 10 个用例（两个状态敏感仪器已拆到独立 case ✓）（2026-09-18 起含 SquadRateMatchesMeasuredBaseline）（Phase B Task 3 追加 5 个 SquadPlacementTest 用例，
# 修复轮次 1 再追加具名用例 SquadMinionsKeepOwnAi → 9；Task 4 追加 SquadFormationRate → 10）。
#
# 阶段 A2 Task 2 说明（当时的计数理由，已被 2026-09-18 的 +1 覆盖）：同一二进制新增的 3 个 `HellfireLevelBaselineTest`
# 用例**故意落在本 case 的 filter 之外**；但 SquadPlacementTest 内**仍在本 filter 内**的新增用例必须同步计数。
# 当前计数 = 11（LevelRosterBaselineTest 3 + SquadPlacementTest 8；2026-09-18 起含
# SquadRateMatchesMeasuredBaseline）。那 3 条依赖 Hellfire 资产的用例在无 HF 环境下
# （CI 只有 spawn.mpq）会 `GTEST_SKIP`，把它们纳入本 filter 会让 "[  PASSED  ] 13 tests."
# 这行硬编码断言在无 HF 环境恒假——即为了给守卫加一层 eval 可见性，反而制造一条
# 环境相关的假红。它们由**全量门禁**（`tools/run_tests.py` 的 ctest 全跑，二进制已在
# `CMake/Tests.cmake:61` 注册）覆盖，本机实跑 3/3 绿、CI 按设计跳过。
id: "level-rosters"
name: "逐层名册 Phase A：放置构成占比在基线带内（真实引擎放置路径）"
category: "rng"
difficulty: "medium"
tags: ["sampling", "monster-generation", "level-roster", "baseline"]

setup:
  # 2026-09-18（内容密度契约 A4）：PlacedClassMixWithinBaseline 的主判据已是
  # "≤ 同种子 vanilla（kVanillaShareBaseline，超范围夹具导出）"，历史基线+5pp 降为报警线。
  mpq_required: true
  # U1（同类）：PlacedClassMix* 走真实建关放置，需 unique 怪染色 TRN（零售或 HF 提供）。
  retail_or_hf_required: true
  # RB22 记账（Task 5，2026-09-17 实测）：本 case 单跑（当时 10 个用例，10x 500-seed 的
  # SquadFormationRate 占大头）实测约 475s，对 timeout=900 余量约 47%。
  # 若再往 LevelRosterBaselineTest/SquadPlacementTest 里加长用例（更多 seed、更多层），
  # 必须同步上调本 timeout，不要让余量被悄悄吃掉。
  timeout: 900

run:
  backend: "gtest"
  binary: "level_roster_baseline_test"
  filter: "LevelRosterBaselineTest.*:SquadPlacementTest.*-*SquadRateMatchesMeasuredBaseline*:*EncounterHasTwoDemandTypes*"
  # 尾部为**负向** filter：两个"状态敏感"的仪器各自独占 case（见 rng/squad-rate.yaml 与
  # rng/encounter-types.yaml ✓），以免在**同一进程**内被前序用例的全局状态影响 ✗。

expected:
  exit_code: 0
  failed: 0
  passed_min: 10
  skipped_max: 1
  output_contains:
    - "[ MEASURED ] level 13 ranged share"
    - "[ MEASURED ] level 14 ranged share"
    - "[ MEASURED ] level 15 ranged share"
    - "[ SQUADRATE ]"
    - "[ SHIPPEDSQUAD ]"
    - "[ SQUADFALLBACK ]"
    - "[ SQUADFORM ]"
    - "[ SQUADLEASH ]"
    - "[ SQUADSIZE ]"
    - "[  PASSED  ] 10 tests."

description: >
  逐层名册 Phase A 的验收门禁：不看采样中间量，直接跑真实
  CreateDungeon -> GetLevelMTypes -> InitMonsters 放置链路，统计 L13-15
  每层 200 seed 的**已放置**怪物构成，断言远程占比（RangedTurret +
  RangedKite / 放置怪总数）不超过「改动前基线 + 5 个百分点」。
  基线取自计划 A-baseline 表（200 seed、同一 fixture、放置怪分母）：
  L13 (3249+2076)/23405 = 22.8%、L14 (9674+3425)/23443 = 55.9%、
  L15 13533/23193 = 58.3%；阈值即 27.8% / 60.9% / 63.3%，以具名
  constexpr 数组落在 test/level_roster_baseline_test.cpp 中，出处写在注释里。
  用例无条件打印实测值（[ MEASURED ] 行，output_contains 断言其存在），
  所以一旦名册数据改动把某层推向远程画廊，门禁不仅会红，还能直接读到数字。
  R4：超标只允许改名册 / class_floors，不允许放宽这里的阈值。
  Task 5 追加（final review I4）：断言范围从 L13-15 扩到 **L1-15**（L16 走硬编码
  分支、在名册路径前 early-return，仍保留 unconstrained 哨兵），因为 max_image
  从 4000 放宽到 16000/18000 的恰是 L1-12，此前没有任何量化守卫。L1-12 基线同样
  取自 A-baseline 表。扩范围后立即暴露 4 个 R4 超标层：L2 17.43%（阈值 14.16%）、
  L3 18.90%（15.99%）、L4 36.12%（21.39%）、L8 45.80%（29.32%）。
  Task 5 第二轮（final review R40）：这 4 层的超标由名册特性本身引入（基线是改动前
  实测值），按 R4 只能改数据、不能动阈值，因此**已整改名册数据**：L2/L3 补入
  Charge/Melee 等廉价 core，L4 去掉两个 RangedTurret core 之一并补 2 个 Melee core，
  L8 去掉 RangedTurret core 并补 Sneak/Charge/Melee core，core 集装不下时同步抬高
  tail_draw / max_image（max_image 是逐层预算参数、非 R4 阈值，spec §4.1 已记载留有余量）。
  整改后实测：L2 10.17% / L3 12.83% / L4 18.94% / L8 25.88%，全部落回带内，
  用例里**不再保留任何超标豁免表**，L1-15 每层都受真实阈值约束。
  同时复核了组合数（500 seed）以确认没有为压占比而把某层压成固定组合：
  L2 117→360、L3 184→439、L4 147→448、L8 66→116，均显著上升。
  实测：L13 23.6% / L14 60.5% / L15 50.1%，三层同样在带内。

  Phase B Task 3 追加：filter 覆盖同一二进制里的 SquadPlacementTest（5 个用例，
  故计数 3 → 8，filter 同步扩为 LevelRosterBaselineTest.*:SquadPlacementTest.*，timeout 300 → 900s），跑的仍是真实 CreateDungeon -> GetLevelMTypes -> InitMonsters 链路。
  用例无条件打印 [ SQUADRATE ]（squad_chance=100 下逐层实测成队率）与
  [ SHIPPEDSQUAD ]（出厂表 squad_chance=30 下逐层实测成队率），output_contains
  断言两行存在，因此小队一旦不成形，门禁不仅会红，还能直接读到逐层数字。
  实测（出厂表、50 seed/层）：逐层 roll 率 26.8%-31.1%（名义 30%），
  realisation 99.6%-100%，leader 放置失败与无 partner 计数全为 0。
  同时记录：均匀 squad_chance=30 会把 L14 远程占比从 60.49% 推到 61.51%、越过
  60.88% 阈值。按 R4 只改数据、不动阈值：先试 class_floors Melee=1 → Melee=2（占比
  60.45% 达标），但全量门禁判红——该改动使 L14 的 unique base 可达性从 6/6 掉到 2/6，
  违反验收 9c（HellUniqueBasesRemainReachable），故回退。Task 3 当时采用 **L14 squad_chance
  30 → 10**（占比 60.51% 达标，9c 恢复 6/6），其余各层保持 30。**该让步已由 Phase B Task D
  取消**（见下）。

  Phase B Task 3 修复轮次 1（评审必须修项）：为两条此前**无守卫**的规格要求补上可失败断言，
  用例数 8 → 9（新增具名用例 `SquadMinionsKeepOwnAi`，规格 §6 验收第 6 行点名）。
  同时 `UnleashedFallbackPlacesNeighboursWithoutLeashing` 从"只测拴系数为 0"改为**真正断言邻近性**：
  §4.3.4 回退的核心保证是"仍把 leader 传给 PlaceGroup"，此前把 `&leader` 改成 `nullptr` 全部用例仍绿。
  unleashed 随从的 leaderRelation 是 None、无 leader 反向指针，放置后无法重新配对，
  因此邻近性在**放置那一刻**由 `SquadRollCounters::{partnersPlaced,maxPartnerLeaderDistance}` 记录。
  新增 `[ SQUADFALLBACK ]` 输出行（output_contains 断言其存在）报告实测最大距离与界。
  另加"随从类型 ≠ leader 类型"断言（此前删掉 PickCorePartnerTypeIndex 的同类型跳过后 8 条用例全绿）。
  四条反证均实跑"改坏→红→恢复→绿"。squad_leashed 解析器的拒绝拼写错误用例落在
  `level_roster_test`（LevelRosterFixtureLoadTest，2 条 EXPECT_EXIT），非本 case 计数。

  Phase B Task 4（验收 7「小队形成率」量化守卫）：用例数 9 → 10，新增
  `SquadPlacementTest.SquadFormationRate`，新增 `[ SQUADFORM ]` 输出行（output_contains 断言其存在）。
  指标 = 「尝试成队的 roll 中真正放下 ≥1 只随从」的比例，分子是新加的
  `SquadRollCounters::formed`（**与 leash 无关**）而非既有 `realised`：`realised` 判定含
  `squadLeashed && packSize > 0`，而 PlaceGroup 只在 leashed 时写 packSize，所以用 `realised`
  做分子会让任何走 §4.3.4 回退（squad_leashed=0）的层恒读 0% —— 守卫会因自己要求的补救被采用而变红。
  分母沿用循环自己的 rolls（非由 squad_chance 反推），故 L14（chance=10）按实际 roll 数评判。
  实测（**出厂表**、500 seed/层、seed base 51000）：逐层形成率 **99.890%-100%**，最差层 L10
  （2718 roll 丢 3 次）。阈值取**统一 floor 0.95**，写进用例内具名数组 `kSquadFormationFloor`
  并在注释里注明出处（本轮 500-seed 实测逐层数值 + 为何留 ~45 倍余量）：出厂配置不会产生
  0.95-0.998 之间的值（放置一坏直接掉 0），故仍可失败；同时不把 squad_size/tail_draw/core 集的
  合法数据调整变成红灯（计划自身建议的下限是 50%，0.95 远严于它）。**是实测分隔线，非紧界、非规格常量。**
  两次反证实跑：(1) 仅 L10 的 PlaceGroup 随从数改 0 → 该层 rate 0.0 必红、邻层数值不动；
  (2) `squadEligible` 加 `currlevel != 11` → 表仍写 chance=30 但分支失联 → 「rolls==0 跳过」豁免
  同样判红（豁免只允许 squad_chance==0 即表自己关掉的层）。恢复后逐层数值与实测逐位一致。
  处置：实测最低 99.890% 远高于计划下限 50%，**各层 squad_leashed 保持 1，本轮无任何层需要
  §4.3.4 回退**，`level_roster_params.tsv` 零改动（RB17 L14 冻结、RB14 class_floors 均未触碰）。

  Phase B 最终修复轮（I1/I2/M1，**用例数不变（当时仍为 10；2026-09-18 后为 11）**：本轮只加断言与输出行，不加用例）：
  I1 —— `minionsOutsideLeash` 原判据 `dx > 4` 恒真（通过钳制的候选必然 dx <= 4），指不出
  什么改动会让它红。现改为具名常量 `kLeashedAxisBound = 4`（由钳制推导：接受条件
  `|xp-x1| < 4` → <=3，而 x1 是 leader 的邻格 → 3+1=4），并新增计数 `minionsAtLeashBound`
  断言**恰好落在界上的随从数 > 0**——这才让"不超过 4"成为紧界守卫。新增 `[ SQUADLEASH ]` 输出行。
  实测：L9-12 x 10 seed 共 1275 只随从，其中 24 只正好在界上，越界 0。
  反证：把 PlaceGroup 的钳制从 >= 4 放宽到 >= 8 → L11/L12 多个种子判红。
  I2 —— `squad_size` 此前无任何守卫（把 PlaceGroup 第 2 参改成常量 1，10 条用例全绿）。
  新增弱但可失败的断言：每支已成形小队的平均随从数 >= 1.5（`kMinMinionsPerSquad`）。
  实测出厂配置 **1.989**（squad_size=2，与 SquadFormationRate 的 ~99.9% 形成率一致）；
  改成常量 1 后实测恰为 **1.0**，必红。1.5 落在这两个值之间的空隙里，不把合法数据调整变成红灯。
  新增 `[ SQUADSIZE ]` 输出行。反证：第 2 参改 1 → 判红（实测 per-squad 1）。
  M1 —— `level_roster_params_squads_off.tsv` 此前同时改了 `squad_chance` 与 `squad_size` 两列，
  而注释称"只差 squad_chance"；"A/B 只差一个变量"是这些用例的立论基础，故采用更强的修法：
  把该夹具的 `squad_size` 改回出厂值 2，现在**真的只差 squad_chance** 一列（该输入合法：
  加载器只拒绝反向组合 `squad_chance > 0 && squad_size == 0`）。反证：把该夹具 squad_chance
  改回 30 → `SquadsAreAbsentWhenTheTableDisablesThem` 判红，确认这一列就是该用例真正测的东西。
  出厂数据（assets/txtdata/**）与 `kRangedShareCeiling` / `kSquadFormationFloor` 阈值本轮零改动。

  Phase B Task D（取消 L14 的 squad_chance 让步，**用例数不变（当时仍为 10；2026-09-18 后为 11）**：本轮只改出厂数据与注释）：
  目标是在**不放宽任何守卫**（`kRangedShareCeiling` / `kSquadFormationFloor` / class_floors 一律不动）
  的前提下让 L14 也用统一的 `squad_chance=30`。结构判据：小队 partner 从**其他 core**抽取，
  所以 3 个 core 里有 2 个是远程会让每支小队都偏远程；而 L14 的 6 个 unique base 是
  **4 Melee + 2 RangedTurret**、B1 cap 为 2/类，因此**任何一类的 core 增到 2 都会关掉该类尾抽**
  并打掉 9c（这正是 Task 3 抬 Melee floor 掉到 2/6 的原因）。**RangedKite 在 L14 没有 unique base**，
  故唯一可动的杠杆是去掉 kite core `MT_XACID`，使 core 变为 1 Melee + 1 RangedTurret。
  实测（200 seed，真实建关放置链路）：
  对照 A@30（原 3 core）**0.615081 > 0.60876 判红**（复现 Task 3 的失败）；
  采纳配置 B@30（去掉 kite core）**0.543672 ≤ 0.60876 通过**，余量由原来的 0.36pp 扩到 **6.5pp**；
  9c 维持 **6/6**（`[ MEASURED ] level 14 unique bases reachable 6/6`）；
  `[ SHIPPEDSQUAD ] level 14` rollRate **0.088 → 0.313406**（名义 30%）；
  L14 每 seed 组合数 **51**（500 seed，RosterPerSeedVariety 通过）；其余各层占比与形成率逐位不变。
  因此 `level_roster_params.tsv` 现在**全 15 层统一 squad_chance=30**，RB17 的 L14 冻结让步解除；
  `class_floors` 仍为 Melee=1（RB14：不是自由杠杆，本轮未触碰）。
