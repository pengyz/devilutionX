id: "dark-expedition-e2e-learnability"
name: "暗夜远征 E2E：学习门控 + 记忆持久化"
category: "dark-expedition"
difficulty: "advanced"
tags: ["depth-layer", "learnability"]

setup:
  mpq_required: false
  timeout: 30

run:
  backend: "gtest"
  binary: "dark_expedition_e2e_test"
  filter: "DarkExpeditionE2ETest.*"

expected:
  exit_code: 0
  failed: 0
  passed_min: 2
  skipped_max: 0
  output_contains: ["[  PASSED  ] 2 tests."]

description: >
  跨机制端到端：Infravision 可学（bookLevel=5）且 ValidatePlayer 不清除已记忆；
  staffLevel 恒 -1（无门控的泄漏通道）。定位变更后无开关，恒生效。
