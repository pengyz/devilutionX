category: "dark-expedition"
difficulty: "medium"
tags: ["economy", "drops"]

setup:
  mpq_required: false
  timeout: 30

run:
  backend: "gtest"
  binary: "dark_expedition_drop_test"
  filter: "DarkExpeditionDropTest.*"

expected:
  exit_code: 0
  failed: 0
  passed_min: 5
  skipped_max: 0
